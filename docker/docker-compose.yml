version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hadivo-postgres
    environment:
      POSTGRES_DB: hadivo
      POSTGRES_USER: hadivo
      POSTGRES_PASSWORD: hadivo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadivo -d hadivo"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hadivo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hadivo
      RABBITMQ_DEFAULT_PASS: hadivo
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
