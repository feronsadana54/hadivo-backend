spring:
  application:
    name: hadivo-attendance-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hadivo}
    username: ${POSTGRES_USER:hadivo}
    password: ${POSTGRES_PASSWORD:hadivo}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:hadivo}
    password: ${RABBITMQ_PASSWORD:hadivo}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

hadivo:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    issuer: hadivo
  messaging:
    exchange: attendance.events
    routing-keys:
      clock-in: attendance.clockin
      clock-out: attendance.clockout
      attempt-failed: attendance.attempt.failed
    notification-queue: attendance.notifications
    notification-events-queue: hadivo.notification.events
    notification-routing-key: notification.event
  notification:
    email:
      provider: ${HADIVO_NOTIFICATION_EMAIL_PROVIDER:mock}
      resend:
        api-key: ${RESEND_API_KEY:}
        from: ${RESEND_FROM_EMAIL:no-reply@hadivo.local}
    push:
      provider: ${HADIVO_NOTIFICATION_PUSH_PROVIDER:mock}
      fcm:
        enabled: ${FCM_ENABLED:false}
        project-id: ${FCM_PROJECT_ID:}
        service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
  payment:
    provider: ${HADIVO_PAYMENT_PROVIDER:mock}
    midtrans:
      enabled: ${HADIVO_PAYMENT_MIDTRANS_ENABLED:false}
      environment: ${HADIVO_PAYMENT_MIDTRANS_ENVIRONMENT:sandbox}
      server-key: ${MIDTRANS_SERVER_KEY:}
      client-key: ${MIDTRANS_CLIENT_KEY:}
      snap-base-url: ${MIDTRANS_SNAP_BASE_URL:https://app.sandbox.midtrans.com}
      api-base-url: ${MIDTRANS_API_BASE_URL:https://api.sandbox.midtrans.com}
  seed:
    super-admin-email: ${SEED_SUPER_ADMIN_EMAIL:superadmin@hadivo.local}
    super-admin-password: ${SEED_SUPER_ADMIN_PASSWORD:ChangeMe123!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.hadivo: DEBUG
    org.hibernate.SQL: INFO
